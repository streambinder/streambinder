name: doc-sync

on:
  repository_dispatch:
    types: [doc-sync]

permissions:
  actions: read
  attestations: none
  checks: none
  contents: none
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: write

concurrency:
  group: doc-sync-master
  cancel-in-progress: false

env:
  doc_repo: "${{ github.event.client_payload.repo }}"
  doc_sha: "${{ github.event.client_payload.sha }}"

jobs:
  doc-sync:
    if: ${{ github.event.client_payload.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    environment:
      name: prod
      deployment: false
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.CI_WORKFLOW_TRIGGER }}
          persist-credentials: true
      - name: Setup repository
        run: |
          git config user.email "automata@davidepucci.it"
          git config user.name "Automata"
      - name: Sync doc to dispatched sha
        run: |
          doc_name="$(awk -F'/' '{print $2}' <<< "${doc_repo}")"
          doc_module="site/docs/${doc_name}"
          git submodule update --init "${doc_module}"
          git --git-dir="${doc_module}/.git" checkout "${doc_sha}"
          git add "${doc_module}"
          if git diff --cached --quiet; then
            echo "No submodule change to commit"
            exit 0
          fi
          git commit -m "docs(${doc_name}): sync (${doc_repo}@$(cut -c-7 <<< "${doc_sha}"))"
      - name: Push repository
        run: |
          doc_name="$(awk -F'/' '{print $2}' <<< "${doc_repo}")"
          doc_module="site/docs/${doc_name}"
          TARGET="${doc_sha}"
          for attempt in 1 2 3 4 5; do
            if git push origin master; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}: realigning to origin/master"
            git fetch --depth 50 origin master
            git reset --hard FETCH_HEAD
            CURRENT="$(git ls-tree HEAD "${doc_module}" | awk '{print $3}')"
            if [ "${CURRENT}" = "${TARGET}" ]; then
              echo "origin/master already points at ${TARGET}; nothing to push"
              exit 0
            fi
            git --git-dir="${doc_module}/.git" fetch --depth 50 origin master || true
            if git --git-dir="${doc_module}/.git" merge-base --is-ancestor "${TARGET}" "${CURRENT}"; then
              echo "origin/master already includes ${TARGET}; nothing to push"
              exit 0
            fi
            git --git-dir="${doc_module}/.git" checkout "${TARGET}"
            git add "${doc_module}"
            if git diff --cached --quiet; then
              echo "No submodule change to commit"
              exit 0
            fi
            git commit -m "docs(${doc_name}): sync (${doc_repo}@$(cut -c-7 <<< "${TARGET}"))"
          done
          echo "Push failed after 5 attempts" >&2
          exit 1
