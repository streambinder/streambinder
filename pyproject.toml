[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streambinder"
version = "0.1.0"
description = "Static site generator for streambinder.github.io"
readme = ".github/README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "Jinja2",
  "Markdown",
  "Pygments",
  "PyYAML",
  "pydantic",
]

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "pytest-cov",
  "types-Markdown",
  "types-PyYAML",
]

[tool.isort]
known_first_party = ["streambinder"]
line_length = 100

[tool.mypy]
strict = true
files = ["src/streambinder"]

[tool.pytest.ini_options]
testpaths = ["src/streambinder"]

[tool.coverage.run]
source = ["src/streambinder"]
omit = ["src/streambinder/conftest.py", "src/streambinder/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
