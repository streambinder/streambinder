[project]
name = "streambinder"
version = "0.1.0"
description = "Static site generator for streambinder.github.io"
readme = ".github/README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "Jinja2",
  "Markdown",
  "Pygments",
  "PyYAML",
  "requests",
]

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "pytest-cov",
  "types-Markdown",
  "types-PyYAML",
  "types-requests",
]

[tool.uv]
package = false

[tool.mypy]
strict = true
files = [".make"]

[tool.pytest.ini_options]
testpaths = [".make"]
pythonpath = [".make"]

[tool.coverage.run]
source = [".make"]
omit = [".make/conftest.py", ".make/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
